<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Campus - Complaint / Service Request</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6fa;color:#222}
  nav{background:#1f3a93;padding:12px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  nav .brand{color:#fff;font-weight:700;font-size:18px;margin-right:auto}
  nav button{background:transparent;color:#fff;border:1px solid #ffffff66;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
  nav button.active{background:#fff;color:#1f3a93;font-weight:600}
  main{max-width:980px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px #0002;margin-bottom:16px}
  h2{margin-top:0}
  label{display:block;margin-top:12px;font-weight:600;font-size:14px}
  input,select,textarea{width:100%;padding:9px;margin-top:4px;border:1px solid #ccd;border-radius:6px;font:inherit}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .btn{background:#1f3a93;color:#fff;border:0;padding:10px 18px;border-radius:6px;cursor:pointer;margin-top:14px;font:inherit}
  .btn.sec{background:#6b7280}
  .btn.sm{padding:6px 12px;margin-top:6px}
  .hidden{display:none}
  .alert{background:#e7f6ec;border-left:4px solid #2e9e4f;padding:10px 14px;margin-bottom:14px;border-radius:4px}
  .alert.err{background:#fdecea;border-color:#c0392b}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
  th,td{padding:10px;border-bottom:1px solid #e3e6ee;text-align:left;font-size:14px;vertical-align:top}
  th{background:#eef1f9}
  .wrap{overflow-x:auto}
  .badge{padding:3px 10px;border-radius:12px;font-size:12px;color:#fff;white-space:nowrap}
  .b-Pending{background:#e69500}.b-In-Progress{background:#2a7de1}
  .b-Resolved{background:#2e9e4f}.b-Rejected{background:#c0392b}
  .p-Urgent{color:#c0392b;font-weight:700}.p-High{color:#e67e22;font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stats div{background:#fff;padding:14px;border-radius:10px;text-align:center;box-shadow:0 1px 4px #0002}
  .stats b{font-size:26px;display:block;color:#1f3a93}
  .filters{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:12px;align-items:end}
  small{color:#666}
  @media(max-width:700px){.row,.filters,.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<nav>
  <span class="brand">🎓 Smart Campus Assistant</span>
  <button id="nav-submit" class="active" onclick="show('submit')">New Request</button>
  <button id="nav-track" onclick="show('track')">Track Requests</button>
  <button id="nav-admin" onclick="show('admin')">Admin</button>
</nav>

<main>
  <div id="msg"></div>

  <!-- SUBMIT -->
  <section id="view-submit">
    <div class="card">
      <h2>Submit a Complaint / Service Request</h2>
      <form id="reqForm">
        <div class="row">
          <div><label>Student ID *</label><input id="student_id" required></div>
          <div><label>Full Name *</label><input id="student_name" required></div>
        </div>
        <label>Email *</label><input type="email" id="email" required>
        <div class="row">
          <div><label>Category *</label><select id="category"></select></div>
          <div><label>Priority *</label><select id="priority"></select></div>
        </div>
        <label>Location (building / room)</label><input id="location" placeholder="e.g. Building 4, Room 502">
        <label>Title *</label><input id="title" maxlength="120" required>
        <label>Description *</label><textarea id="description" rows="5" required></textarea>
        <button class="btn" type="submit">Submit Request</button>
      </form>
    </div>
  </section>

  <!-- TRACK -->
  <section id="view-track" class="hidden">
    <div class="card">
      <h2>Track My Requests</h2>
      <form id="trackForm">
        <label>Student ID</label><input id="track_id" required>
        <button class="btn" type="submit">Search</button>
      </form>
    </div>
    <div class="wrap" id="trackResult"></div>
  </section>

  <!-- ADMIN -->
  <section id="view-admin" class="hidden">
    <div id="adminLogin" class="card" style="max-width:380px;margin:auto">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <label>Password</label><input type="password" id="admin_pw" required>
        <button class="btn" type="submit">Login</button>
      </form>
    </div>

    <div id="adminPanel" class="hidden">
      <div class="stats" id="stats"></div>
      <div class="card filters">
        <div><label>Status</label><select id="f_status"></select></div>
        <div><label>Category</label><select id="f_category"></select></div>
        <div><label>Search</label><input id="f_q" placeholder="title / student / ticket #"></div>
        <button class="btn" style="margin:0" onclick="renderAdmin()">Filter</button>
      </div>
      <div class="wrap" id="adminTable"></div>
      <button class="btn sec" onclick="logout()">Logout</button>
    </div>
  </section>
</main>

<script>
/* ---------- Config ---------- */
const CATEGORIES = ["Classroom Issue","Academic Support","Lost Belongings","Maintenance Problem","Administrative Service"];
const PRIORITIES = ["Low","Medium","High","Urgent"];
const STATUSES   = ["Pending","In Progress","Resolved","Rejected"];
const ADMIN_PASSWORD = "admin123";
const KEY = "campus_requests";

/* ---------- Storage ---------- */
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = d => localStorage.setItem(KEY, JSON.stringify(d));
let isAdmin = false;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => new Date().toLocaleString();
const fill = (el, arr, all) => el.innerHTML = (all ? `<option value="">All</option>` : "") + arr.map(x => `<option>${x}</option>`).join("");
const badge = s => `<span class="badge b-${s.replace(" ","-")}">${s}</span>`;

function notify(text, err) {
  $("msg").innerHTML = `<div class="alert ${err ? "err" : ""}">${esc(text)}</div>`;
  setTimeout(() => $("msg").innerHTML = "", 5000);
}

function show(v) {
  ["submit","track","admin"].forEach(n => {
    $("view-" + n).classList.toggle("hidden", n !== v);
    $("nav-" + n).classList.toggle("active", n === v);
  });
  if (v === "admin") syncAdmin();
}

/* ---------- Init ---------- */
fill($("category"), CATEGORIES);
fill($("priority"), PRIORITIES);
$("priority").value = "Medium";
fill($("f_status"), STATUSES, true);
fill($("f_category"), CATEGORIES, true);

/* ---------- Submit ---------- */
$("reqForm").addEventListener("submit", e => {
  e.preventDefault();
  const data = load();
  const id = data.length ? Math.max(...data.map(r => r.id)) + 1 : 1;
  data.push({
    id,
    student_id: $("student_id").value.trim(),
    student_name: $("student_name").value.trim(),
    email: $("email").value.trim(),
    category: $("category").value,
    priority: $("priority").value,
    location: $("location").value.trim(),
    title: $("title").value.trim(),
    description: $("description").value.trim(),
    status: "Pending",
    remarks: "",
    created_at: now(),
    updated_at: now()
  });
  save(data);
  notify(`Request submitted! Your ticket number is #${id}.`);
  const sid = $("student_id").value.trim();
  e.target.reset();
  $("priority").value = "Medium";
  $("track_id").value = sid;
  show("track");
  renderTrack(sid);
});

/* ---------- Track ---------- */
function renderTrack(sid) {
  const rows = load().filter(r => r.student_id === sid).sort((a, b) => b.id - a.id);
  $("trackResult").innerHTML = `<table>
    <tr><th>#</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Remarks</th><th>Submitted</th></tr>
    ${rows.map(r => `<tr><td>${r.id}</td><td>${esc(r.title)}<br><small>${esc(r.location) || "-"}</small></td>
      <td>${esc(r.category)}</td><td class="p-${r.priority}">${r.priority}</td>
      <td>${badge(r.status)}</td><td>${esc(r.remarks) || "-"}</td><td>${esc(r.created_at)}</td></tr>`).join("")
      || `<tr><td colspan="7">No requests found.</td></tr>`}
  </table>`;
}
$("trackForm").addEventListener("submit", e => { e.preventDefault(); renderTrack($("track_id").value.trim()); });

/* ---------- Admin ---------- */
function syncAdmin() {
  $("adminLogin").classList.toggle("hidden", isAdmin);
  $("adminPanel").classList.toggle("hidden", !isAdmin);
  if (isAdmin) renderAdmin();
}

$("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  if ($("admin_pw").value === ADMIN_PASSWORD) { isAdmin = true; $("admin_pw").value = ""; syncAdmin(); }
  else notify("Wrong password.", true);
});

function logout() { isAdmin = false; syncAdmin(); show("submit"); }

function renderAdmin() {
  const all = load();
  $("stats").innerHTML =
    `<div><b>${all.length}</b>Total</div>` +
    STATUSES.filter(s => s !== "Rejected").map(s => `<div><b>${all.filter(r => r.status === s).length}</b>${s}</div>`).join("");

  const fs = $("f_status").value, fc = $("f_category").value, q = $("f_q").value.trim().toLowerCase();
  const order = { Urgent: 0, High: 1, Medium: 2, Low: 3 };
  const rows = all.filter(r =>
      (!fs || r.status === fs) && (!fc || r.category === fc) &&
      (!q || [r.title, r.student_name, r.student_id, String(r.id)].some(x => x.toLowerCase().includes(q))))
    .sort((a, b) => order[a.priority] - order[b.priority] || b.id - a.id);

  $("adminTable").innerHTML = `<table>
    <tr><th>#</th><th>Student</th><th>Request</th><th>Priority</th><th>Status</th><th>Action</th></tr>
    ${rows.map(r => `<tr>
      <td>${r.id}</td>
      <td>${esc(r.student_name)}<br><small>${esc(r.student_id)}<br>${esc(r.email)}</small></td>
      <td><b>${esc(r.title)}</b><br><small>${esc(r.category)} | ${esc(r.location) || "-"}</small><br>${esc(r.description)}</td>
      <td class="p-${r.priority}">${r.priority}</td>
      <td>${badge(r.status)}</td>
      <td>
        <select id="st-${r.id}">${STATUSES.map(s => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select>
        <input id="rm-${r.id}" placeholder="Remarks" value="${esc(r.remarks)}" style="margin-top:6px">
        <button class="btn sm" onclick="updateReq(${r.id})">Update</button>
        <button class="btn sm sec" onclick="deleteReq(${r.id})">Delete</button>
      </td></tr>`).join("") || `<tr><td colspan="6">No requests.</td></tr>`}
  </table>`;
}

function updateReq(id) {
  const data = load();
  const r = data.find(x => x.id === id);
  if (!r) return;
  r.status = $("st-" + id).value;
  r.remarks = $("rm-" + id).value.trim();
  r.updated_at = now();
  save(data);
  renderAdmin();
  notify(`Request #${id} updated to ${r.status}.`);
}

function deleteReq(id) {
  if (!confirm(`Delete request #${id}?`)) return;
  save(load().filter(r => r.id !== id));
  renderAdmin();
  notify(`Request #${id} deleted.`);
}
</script>
</body>
</html>
