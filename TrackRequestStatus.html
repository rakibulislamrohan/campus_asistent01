<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Campus - Track Request Status</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6fa;color:#222}
  nav{background:#1f3a93;padding:14px 24px;color:#fff;font-weight:700;font-size:18px}
  main{max-width:820px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px #0002;margin-bottom:16px}
  h2,h3{margin-top:0}
  label{display:block;font-weight:600;font-size:14px}
  input,select{width:100%;padding:9px;margin-top:4px;border:1px solid #ccd;border-radius:6px;font:inherit}
  .row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
  .btn{background:#1f3a93;color:#fff;border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font:inherit}
  .btn.sec{background:#6b7280}.btn.sm{padding:5px 10px;font-size:13px}
  .alert{background:#fdecea;border-left:4px solid #c0392b;padding:10px 14px;border-radius:4px;margin-bottom:14px}
  .badge{padding:3px 10px;border-radius:12px;font-size:12px;color:#fff;white-space:nowrap}
  .b-Pending{background:#e69500}.b-In-Progress{background:#2a7de1}.b-Resolved{background:#2e9e4f}.b-Rejected{background:#c0392b}
  .p-Urgent{color:#c0392b;font-weight:700}.p-High{color:#e67e22;font-weight:700}
  .head{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}
  /* stepper */
  .stepper{display:flex;margin:24px 0 8px}
  .step{flex:1;text-align:center;position:relative;font-size:13px;color:#888}
  .step::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:4px;background:#d9dde8;z-index:0}
  .step:first-child::before{display:none}
  .dot{width:34px;height:34px;border-radius:50%;background:#d9dde8;color:#fff;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;z-index:1}
  .step.done{color:#222}.step.done .dot{background:#2e9e4f}.step.done::before{background:#2e9e4f}
  .step.current .dot{background:#2a7de1;box-shadow:0 0 0 5px #2a7de133}.step.current{color:#222;font-weight:700}
  .step.current::before{background:#2e9e4f}
  .step.rejected .dot{background:#c0392b;box-shadow:0 0 0 5px #c0392b33}.step.rejected{color:#c0392b;font-weight:700}
  .step.rejected::before{background:#2e9e4f}
  /* timeline */
  .timeline{border-left:3px solid #d9dde8;margin:10px 0 0 8px;padding-left:18px}
  .tl{position:relative;margin-bottom:16px}
  .tl::before{content:"";position:absolute;left:-26px;top:4px;width:12px;height:12px;border-radius:50%;background:#1f3a93}
  .tl small{color:#666;display:block}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px;font-size:14px;margin:14px 0}
  .kv span:nth-child(odd){font-weight:600;color:#555}
  .desc{background:#f4f6fa;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:14px}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #e3e6ee;cursor:pointer}
  .list-item:hover{background:#f6f8fd}
  details{margin-top:18px;font-size:14px} summary{cursor:pointer;color:#555}
  .hidden{display:none}
  small{color:#666}
  @media(max-width:600px){.row{grid-template-columns:1fr}.step{font-size:11px}}
</style>
</head>
<body>
<nav>🎓 Smart Campus Assistant - Track Request Status</nav>

<main>
  <div class="card">
    <h2>Track Your Request</h2>
    <form id="trackForm" class="row">
      <div><label>Student ID *</label><input id="sid" required placeholder="e.g. 232-35-345"></div>
      <div><label>Ticket # <small>(optional)</small></label><input id="tid" type="number" min="1" placeholder="Leave blank to see all"></div>
      <button class="btn" type="submit">Track</button>
    </form>
    <p style="margin-bottom:0"><button class="btn sec sm" onclick="addSamples()">Load Sample Data</button></p>
  </div>

  <div id="error"></div>
  <div id="list"></div>
  <div id="detail"></div>
</main>

<script>
/* ---------- Config ---------- */
const REQ_KEY = "campus_requests";       // shared with other features
const FLOW = ["Pending","In Progress","Resolved"];   // normal progress path
const STATUSES = ["Pending","In Progress","Resolved","Rejected"];

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const read = () => { try { return JSON.parse(localStorage.getItem(REQ_KEY)) || []; } catch { return []; } };
const write = d => localStorage.setItem(REQ_KEY, JSON.stringify(d));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => new Date().toLocaleString();
const badge = s => `<span class="badge b-${String(s).replace(" ","-")}">${esc(s)}</span>`;

let current = { sid: "", tid: null };

/* ---------- History (uses r.history when present, else derives it) ---------- */
function historyOf(r) {
  if (Array.isArray(r.history) && r.history.length) return r.history;
  const h = [{ status: "Pending", note: "Request submitted.", at: r.created_at }];
  if (r.status !== "Pending") h.push({ status: r.status, note: r.remarks || "Status updated.", at: r.updated_at });
  return h;
}

/* ---------- Render ---------- */
function stepper(r) {
  const rejected = r.status === "Rejected";
  const idx = rejected ? 1 : FLOW.indexOf(r.status);
  const steps = rejected ? ["Pending", "Rejected"] : FLOW;
  const labels = { "Pending": "Submitted / Pending", "In Progress": "In Progress", "Resolved": "Resolved", "Rejected": "Rejected" };
  return `<div class="stepper">${steps.map((s, i) => {
    let cls = "";
    if (rejected && s === "Rejected") cls = "rejected";
    else if (i < idx) cls = "done";
    else if (i === idx) cls = (r.status === "Resolved") ? "done" : "current";
    const icon = cls === "done" ? "✓" : (cls === "rejected" ? "✕" : i + 1);
    return `<div class="step ${cls}"><div class="dot">${icon}</div>${labels[s]}</div>`;
  }).join("")}</div>`;
}

function renderDetail(id) {
  const r = read().find(x => x.id === id && x.student_id === current.sid);
  if (!r) { $("detail").innerHTML = ""; return; }
  current.tid = id;
  const hist = historyOf(r).slice().reverse();
  $("detail").innerHTML = `
  <div class="card">
    <div class="head">
      <div><h2 style="margin-bottom:4px">#${r.id} - ${esc(r.title)}</h2>
        <small>${esc(r.category) || "Uncategorized"} | <span class="p-${r.priority}">${esc(r.priority)}</span> priority</small></div>
      ${badge(r.status)}
    </div>
    ${stepper(r)}
    <div class="kv">
      <span>Location</span><span>${esc(r.location) || "-"}</span>
      <span>Submitted</span><span>${esc(r.created_at)}</span>
      <span>Last updated</span><span>${esc(r.updated_at)}</span>
    </div>
    <b>Description</b><div class="desc">${esc(r.description)}</div>
    <br><b>Latest authority remarks</b><div class="desc">${esc(r.remarks) || "No remarks yet."}</div>
    <h3 style="margin-top:22px">Status History</h3>
    <div class="timeline">${hist.map(h => `
      <div class="tl">${badge(h.status)} <small>${esc(h.at)}</small>${esc(h.note)}</div>`).join("")}</div>

    <details>
      <summary>Demo only: simulate an authority update</summary>
      <div class="row" style="margin-top:10px;grid-template-columns:1fr 2fr auto">
        <div><label>New status</label><select id="d_status">${STATUSES.map(s => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>
        <div><label>Remarks</label><input id="d_note" placeholder="Remark for student"></div>
        <button class="btn" onclick="simulate(${r.id})">Apply</button>
      </div>
    </details>
    <p><button class="btn sec sm" onclick="refresh()">Refresh</button></p>
  </div>`;
}

function renderList(rows) {
  $("list").innerHTML = `<div class="card"><h3>Your Requests (${rows.length})</h3>` +
    rows.map(r => `<div class="list-item" onclick="renderDetail(${r.id})">
      <div><b>#${r.id} ${esc(r.title)}</b><br><small>${esc(r.category) || "Uncategorized"} | ${esc(r.created_at)}</small></div>
      ${badge(r.status)}</div>`).join("") + `</div>`;
}

/* ---------- Actions ---------- */
$("trackForm").addEventListener("submit", e => {
  e.preventDefault();
  current.sid = $("sid").value.trim();
  const tid = $("tid").value.trim();
  $("error").innerHTML = ""; $("list").innerHTML = ""; $("detail").innerHTML = "";

  const mine = read().filter(r => r.student_id === current.sid).sort((a, b) => b.id - a.id);
  if (!mine.length) return fail("No requests found for this Student ID.");

  if (tid) {
    const r = mine.find(x => x.id === +tid);
    if (!r) return fail(`Ticket #${esc(tid)} was not found for this Student ID.`);
    renderDetail(r.id);
  } else {
    renderList(mine);
    if (mine.length === 1) renderDetail(mine[0].id);
  }
});

function fail(msg) { $("error").innerHTML = `<div class="alert">${msg}</div>`; }

function refresh() {
  if (!current.sid) return;
  const mine = read().filter(r => r.student_id === current.sid).sort((a, b) => b.id - a.id);
  if ($("list").innerHTML) renderList(mine);
  if (current.tid) renderDetail(current.tid);
}

function simulate(id) {
  const data = read(), r = data.find(x => x.id === id);
  if (!r) return;
  const status = $("d_status").value, note = $("d_note").value.trim();
  r.history = historyOf(r).slice();
  r.history.push({ status, note: note || "Status updated.", at: now() });
  r.status = status; r.remarks = note || r.remarks; r.updated_at = now();
  write(data);
  refresh();
}

function addSamples() {
  const data = read();
  let id = data.length ? Math.max(...data.map(r => r.id)) : 0;
  const day = n => new Date(Date.now() - n * 86400000).toLocaleString();
  const S = [
    { title: "WiFi not working in library", description: "Cannot connect to the internet.", category: "IT", priority: "High", status: "In Progress",
      history: [{status:"Pending",note:"Request submitted.",at:day(3)},{status:"In Progress",note:"Assigned to IT team.",at:day(1)}], remarks: "Assigned to IT team." },
    { title: "Lost wallet", description: "Black wallet with ID card.", category: "Lost & Found", priority: "Medium", status: "Resolved",
      history: [{status:"Pending",note:"Request submitted.",at:day(5)},{status:"In Progress",note:"Checking with security.",at:day(4)},{status:"Resolved",note:"Wallet found, collect from office.",at:day(2)}], remarks: "Wallet found, collect from office." },
    { title: "Request for new club room", description: "Robotics club needs a space.", category: "Administrative", priority: "Low", status: "Rejected",
      history: [{status:"Pending",note:"Request submitted.",at:day(6)},{status:"Rejected",note:"No rooms available this semester.",at:day(3)}], remarks: "No rooms available this semester." }
  ];
  S.forEach(s => data.push({ id: ++id, student_id: "232-35-345", student_name: "Pranto", email: "", location: "Main Campus",
    created_at: s.history[0].at, updated_at: s.history[s.history.length - 1].at, ...s }));
  write(data);
  $("sid").value = "232-35-345";
  $("trackForm").requestSubmit();
}

window.addEventListener("storage", refresh);   // live-update when another tab changes data
</script>
</body>
</html>
